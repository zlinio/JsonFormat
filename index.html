<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <style>html { background: var(--page, #fff); color-scheme: light; } html[data-theme="dark"] { background: var(--page, #0c0c0c); color-scheme: dark; }</style>
    <script>
      // Apply the saved appearance before styles and React load to avoid a white flash.
      (() => {
        let preference;
        try { preference = localStorage.getItem("json-format.theme"); } catch {}
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0c0c0c" : "#ffffff";
      })();
    </script>
    <meta name="description" content="在浏览器中使用实用工具，轻松处理日常数据。" />
    <title>Toolbox · 浏览器工具合集</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
